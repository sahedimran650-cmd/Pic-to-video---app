
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pic to Video - Real Hug PRO ❤️</title>
<style>
body{background:#0f0f0f;color:white;font-family:sans-serif;text-align:center;padding:15px}
.box{background:#1e1e1e;padding:20px;border-radius:15px;max-width:400px;margin:auto}
input{width:100%;margin:8px 0;padding:10px;border-radius:8px;border:none}
button{background:linear-gradient(45deg,#ff006a,#ff8a00);color:white;border:none;padding:15px;width:100%;border-radius:10px;font-size:18px;font-weight:bold;margin-top:10px}
canvas{width:100%;border-radius:10px;margin-top:15px;background:black;display:none}
#status{margin-top:10px;color:#00ff88}
</style>
</head>
<body>
<div class="box">
<h2>❤️ Real Hug Video Maker ❤️</h2>
<input type="file" id="pic1" accept="image/*">
<input type="file" id="pic2" accept="image/*">
<input type="text" id="text" placeholder="Text: My Love Story ❤️" value="My Love Story ❤️">
<button onclick="makeHugVideo()">🤗 HUG VIDEO BANAO</button>
<div id="status"></div>
<canvas id="canvas" width="720" height="1280"></canvas>
<video id="preview" controls style="width:100%;margin-top:15px;display:none"></video>
<a id="downloadBtn" style="display:none"><button>⬇️ DOWNLOAD VIDEO</button></a>
</div>

<script>
let img1=new Image(), img2=new Image();
let img1Loaded=false, img2Loaded=false;

document.getElementById('pic1').onchange=e=>{
  let r=new FileReader(); r.onload=ev=>{img1.src=ev.target.result; img1Loaded=true}; r.readAsDataURL(e.target.files[0]);
}
document.getElementById('pic2').onchange=e=>{
  let r=new FileReader(); r.onload=ev=>{img2.src=ev.target.result; img2Loaded=true}; r.readAsDataURL(e.target.files[0]);
}

async function makeHugVideo(){
 if(!img1Loaded ||!img2Loaded){alert("Bondhu 2 ta pic select koro age!");return;}
 const canvas=document.getElementById('canvas');
 const ctx=canvas.getContext('2d');
 canvas.style.display='block';
 document.getElementById('status').innerText="Hug Video Banacche... ⏳";

 const stream=canvas.captureStream(30);
 const recorder=new MediaRecorder(stream,{mimeType:'video/webm'});
 let chunks=[];
 recorder.ondataavailable=e=>chunks.push(e.data);
 recorder.onstop=()=>{
   let blob=new Blob(chunks,{type:'video/webm'});
   let url=URL.createObjectURL(blob);
   document.getElementById('preview').src=url;
   document.getElementById('preview').style.display='block';
   let dl=document.getElementById('downloadBtn');
   dl.href=url; dl.download='hug-video-'+Date.now()+'.webm'; dl.style.display='block';
   document.getElementById('status').innerText="Ready Bondhu! ❤️ Download koro";
 }

 recorder.start();
 let duration=4000; // 4 second
 let start=performance.now();
 let hearts=[];
 for(let i=0;i<20;i++) hearts.push({x:Math.random()*720,y:Math.random()*1280,s:Math.random()*20+10,sp:Math.random()*2+1});

 function draw(now){
   let elapsed=now-start;
   let progress=Math.min(elapsed/duration,1);
   // Hug animation: 2 images come close
   let move = progress * 250; // kache asbe

   ctx.fillStyle='black'; ctx.fillRect(0,0,720,1280);

   // Background blur of pic1
   ctx.globalAlpha=0.3; ctx.drawImage(img1,0,0,720,1280); ctx.globalAlpha=1;

   // Left Image (moves right)
   let x1 = 50 + move;
   let y1 = 400 - move*0.2;
   let scale1 = 1 - progress*0.2;
   ctx.save(); ctx.translate(x1+200*scale1, y1+200*scale1); ctx.scale(scale1,scale1);
   ctx.drawImage(img1,-200,-200,400,400); ctx.restore();

   // Right Image (moves left)
   let x2 = 470 - move;
   let y2 = 400 - move*0.2;
   let scale2 = 1 - progress*0.2;
   ctx.save(); ctx.translate(x2+200*scale2, y2+200*scale2); ctx.scale(scale2,scale2);
   ctx.drawImage(img2,-200,-200,400,400); ctx.restore();

   // Hug Glow when close
   if(progress>0.6){
     ctx.fillStyle=`rgba(255,0,100,${(progress-0.6)*1.5})`;
     ctx.beginPath(); ctx.arc(360, 600, 100+(progress*50), 0, Math.PI*2); ctx.fill();
   }

   // Hearts
   ctx.fillStyle='❤️'; ctx.font='30px Arial';
   hearts.forEach(h=>{
     h.y-=h.sp; if(h.y<0) h.y=1280;
     if(progress>0.3) ctx.fillText('❤️',h.x,h.y);
   });

   // Text
   ctx.fillStyle='white'; ctx.font='bold 50px Arial'; ctx.textAlign='center';
   ctx.fillText(document.getElementById('text').value, 360, 1100);

   if(progress<1) requestAnimationFrame(draw);
   else recorder.stop();
 }
 requestAnimationFrame(draw);
}
</script>
</body>
</html>

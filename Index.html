<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PicToVideo Pro</title>
<style>
body{margin:0;background:#0f0a1e;color:#fff;font-family:sans-serif;padding:16px}
.header{padding:10px 0;font-size:22px;font-weight:bold}
.card{background:#1c153a;border:1px solid #3d2e7a;border-radius:18px;padding:14px;margin:12px 0}
.btn{width:100%;background:linear-gradient(90deg,#8a5cff,#5f27cd);color:#fff;border:none;padding:16px;border-radius:28px;font-size:18px;font-weight:bold}
input,textarea{width:100%;background:#251d4a;color:#fff;border:1px solid #3d2e7a;padding:12px;border-radius:12px;margin:6px 0;box-sizing:border-box}
img{width:100%;border-radius:12px;margin-top:8px;display:none}
</style>
</head>
<body>
<div class="header">✨ PicToVideo - Dark Mode</div>
<div class="card">
<b>📸 Photo 1</b>
<input type="file" id="p1" accept="image/*" onchange="preview(this,'im1')">
<img id="im1">
<b style="margin-top:10px;display:block">📸 Photo 2</b>
<input type="file" id="p2" accept="image/*" onchange="preview(this,'im2')">
<img id="im2">
</div>
<div class="card">
<b>✨ Prompt</b>
<textarea id="pr" rows="3" placeholder="Ex: make them hug, kiss, anime style, cinematic"></textarea>
<button class="btn" onclick="gen()">Generate Video ✨</button>
<p id="st" style="text-align:center;opacity:0.7"></p>
<video id="vid" controls style="width:100%;border-radius:12px;display:none;margin-top:10px"></video>
</div>
<script>
function preview(input,id){
 let img=document.getElementById(id);
 img.src=URL.createObjectURL(input.files[0]);
 img.style.display='block';
}
function gen(){
 document.getElementById('st').innerText='Video generating... (demo mode) - API connect korle ekhane video asbe';
 // ekhane pore HuggingFace free API add korbo
}
</script>
</body>
</html>
